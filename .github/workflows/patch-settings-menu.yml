name: Patch settings menu

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-settings-menu.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move settings into collapsible menu page
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # Idempotency: do nothing if the menu page is already installed.
          if 'id="settingsPanel"' in text and "menuAction('settings')" in text:
              print('Settings menu already installed; nothing to change.')
              raise SystemExit(0)

          # 1) Add a dedicated menu item before the theme item.
          theme_marker = "                    <button onclick=\"menuAction('theme')\""
          if theme_marker not in text:
              raise SystemExit('Theme menu marker not found')

          settings_menu = '''                    <button onclick="menuAction('settings')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-left hover:bg-blue-50 dark:hover:bg-blue-950/40 transition active:scale-[.98]">
                        <span class="w-8 h-8 rounded-xl bg-blue-500/10 dark:bg-blue-500/20 text-blue-600 dark:text-blue-400 border border-blue-500/30 flex items-center justify-center shrink-0">
                            <i class="fa-solid fa-sliders text-xs"></i>
                        </span>
                        <span class="flex-1">
                            <span class="block text-xs font-bold text-slate-800 dark:text-slate-100">Параметры и Валюта</span>
                            <span class="block text-[10px] text-slate-500 dark:text-slate-400">Ставка, такси и график выплат</span>
                        </span>
                        <i class="fa-solid fa-chevron-right text-[10px] text-slate-400"></i>
                    </button>

'''
          text = text.replace(theme_marker, settings_menu + theme_marker, 1)

          # 2) Turn the existing settings card into a full-screen page opened from the menu.
          settings_start = '''        <!-- 1. Настройки -->
        <section class="bg-white dark:bg-slate-900/80 backdrop-blur-md rounded-2xl p-4 border border-slate-200/80 dark:border-slate-800/80 shadow-sm dark:shadow-xl space-y-3 transition-colors">'''
          settings_replacement = '''        <!-- 1. Настройки — отдельная страница из главного меню -->
        <section id="settingsPanel" class="hidden fixed inset-0 z-[60] bg-slate-100 dark:bg-darkbg overflow-y-auto px-4 py-4 pb-24 transition-colors">
            <div class="max-w-md mx-auto bg-white dark:bg-slate-900/95 backdrop-blur-md rounded-2xl p-4 border border-slate-200/80 dark:border-slate-800/80 shadow-xl space-y-3 transition-colors">'''
          if settings_start not in text:
              raise SystemExit('Settings section start not found')
          text = text.replace(settings_start, settings_replacement, 1)

          # 3) Add a close button to the settings page header.
          old_header = '''            <div class="flex items-center justify-between text-blue-600 dark:text-blue-400 font-semibold text-sm">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-sliders text-base"></i>
                    <span>Параметры и Валюта</span>
                </div>
            </div>'''
          new_header = '''            <div class="flex items-center justify-between text-blue-600 dark:text-blue-400 font-semibold text-sm sticky top-0 bg-white/95 dark:bg-slate-900/95 backdrop-blur py-1 z-10">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-sliders text-base"></i>
                    <span>Параметры и Валюта</span>
                </div>
                <button type="button" onclick="closeSettingsPanel()" aria-label="Закрыть параметры" class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 flex items-center justify-center border border-slate-200 dark:border-slate-700 active:scale-95 transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>'''
          if old_header not in text:
              raise SystemExit('Settings header not found')
          text = text.replace(old_header, new_header, 1)

          # 4) Close the inner card before the calendar begins.
          calendar_marker = '''        </section>

        <!-- 2. Календарь -->'''
          if calendar_marker not in text:
              raise SystemExit('Calendar marker not found')
          text = text.replace(calendar_marker, '''            </div>
        </section>

        <!-- 2. Календарь -->''', 1)

          # 5) Add open/close functions and wire the menu action.
          menu_action_old = '''        function menuAction(action) {
            closeMainMenu();
            if (action === 'pdf') generatePdfReport();
            else if (action === 'theme') toggleTheme();
            else if (action === 'ai') openAiModal();
            else if (action === 'aiSettings') openAiSettings();
            else if (action === 'reset') resetData();
        }'''
          menu_action_new = '''        function openSettingsPanel() {
            const panel = document.getElementById('settingsPanel');
            if (!panel) return;
            panel.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            panel.scrollTop = 0;
        }

        function closeSettingsPanel() {
            const panel = document.getElementById('settingsPanel');
            if (!panel) return;
            panel.classList.add('hidden');
            document.body.style.overflow = '';
        }

        function menuAction(action) {
            closeMainMenu();
            if (action === 'settings') openSettingsPanel();
            else if (action === 'pdf') generatePdfReport();
            else if (action === 'theme') toggleTheme();
            else if (action === 'ai') openAiModal();
            else if (action === 'aiSettings') openAiSettings();
            else if (action === 'reset') resetData();
        }'''
          if menu_action_old not in text:
              raise SystemExit('menuAction function not found')
          text = text.replace(menu_action_old, menu_action_new, 1)

          # 6) Escape closes settings before other modals.
          escape_old = '''            if (!document.getElementById('mainMenuDropdown').classList.contains('hidden')) closeMainMenu();
            else if (!document.getElementById('aiSettingsModal').classList.contains('hidden')) closeAiSettings();'''
          escape_new = '''            if (!document.getElementById('mainMenuDropdown').classList.contains('hidden')) closeMainMenu();
            else if (!document.getElementById('settingsPanel').classList.contains('hidden')) closeSettingsPanel();
            else if (!document.getElementById('aiSettingsModal').classList.contains('hidden')) closeAiSettings();'''
          if escape_old not in text:
              raise SystemExit('Escape handler marker not found')
          text = text.replace(escape_old, escape_new, 1)

          path.write_text(text, encoding='utf-8')
          print('Settings menu patch applied successfully.')

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Move settings into menu"
          git push
