name: Visible GitHub Pages test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-settings-menu.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add visible deployment test banner
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = 'id="github-pages-test"'
          if marker in text:
              print('Test banner already exists')
              raise SystemExit(0)
          banner = '''\n    <div id="github-pages-test" style="position:fixed;left:12px;right:12px;bottom:88px;z-index:9999;background:#16a34a;color:white;padding:10px 14px;border-radius:14px;text-align:center;font:700 13px system-ui;box-shadow:0 8px 24px rgba(0,0,0,.22)">✅ GitHub edit ishladi — 19.08.2026</div>\n'''
          text = text.replace('</body>', banner + '</body>', 1)
          path.write_text(text, encoding='utf-8')
          print('Visible test banner added')

      - name: Commit test edit
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add visible GitHub Pages test banner"
          git push
