<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>TyuProduct — склад кухни</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css?v=1">
  <link rel="stylesheet" href="./enhancements.css?v=3">
  <script src="https://cdn.jsdelivr.net/npm/pdfmake@0.2.12/build/pdfmake.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdfmake@0.2.12/build/vfs_fonts.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body>
  <main id="app">
    <header class="top"><div><small>СКЛАД КУХНИ</small><h1>TyuProduct</h1></div><div class="top-actions"><span title="Firebase подключён" class="online-dot">●</span><button id="shareButton" class="qr-share" title="Поделиться сайтом"><span id="qrSmall"></span></button></div></header>
    <section class="hero">
      <div><span id="shiftCaption">Текущая смена</span><input id="shiftName" aria-label="Название смены"></div>
      <input id="viewDate" class="date-picker" type="date" aria-label="Дата">
      <button id="newShift" class="soft">Новая смена</button>
    </section>
    <section class="summary">
      <article><span>Позиций</span><strong id="allCount">0</strong></article>
      <article class="danger-card"><span>Нужно купить</span><strong id="missingCount">0</strong></article>
      <article class="ok-card"><span>В достатке</span><strong id="okCount">0</strong></article>
    </section>
    <section class="tools">
      <input id="search" type="search" placeholder="Поиск продукта или упаковки">
      <button id="remainsButton" class="remains-button" title="Показать незаполненные">Осталось <b id="unfilledCount">0</b></button>
      <button id="addItem" class="icon-btn plus" title="Добавить">＋</button>
    </section>
    <nav id="categories" class="chips"></nav>
    <label class="only-missing"><input id="onlyMissing" type="checkbox"> Показать только то, что нужно купить</label>
    <section id="list" class="inventory"></section>
    <section id="result" class="result">
      <div class="result-head"><div><small>РЕЗУЛЬТАТ СМЕНЫ</small><h2>Что нужно получить</h2></div><button id="copyResult" class="soft">Копировать</button></div>
      <div id="needList" class="need-list"></div>
      <button id="saveShift" class="primary save">Сохранить смену</button>
      <div id="saveStatus" class="status"></div>
    </section>
    <section class="result history-panel">
      <div class="result-head"><div><small>ИСТОРИЯ</small><h2>Сохранённые смены</h2></div></div>
      <select id="historySelect" class="history-select"><option value="">Выберите смену</option></select>
      <button id="downloadPdf" class="primary save" disabled>Скачать выбранную смену PDF</button>
    </section>
  </main>
  <dialog id="itemDialog"><form id="itemForm" method="dialog"><input id="itemId" type="hidden"><h2 id="itemDialogTitle">Новая позиция</h2><label>Название<input id="itemName" required placeholder="Например: палочки для суши"></label><label>Категория<select id="itemCategory"><option>Продукты</option><option>Соусы и специи</option><option>Упаковка</option><option>Расходники</option></select></label><div class="two"><label>Единица<select id="itemUnit"><option>кг</option><option>г</option><option>л</option><option>мл</option><option>шт</option><option>рул</option><option>уп</option></select></label><label>Должно быть<input id="itemTarget" type="number" min="0" step="0.001" value="0"></label></div><div class="dialog-actions"><button type="button" id="cancelItem" class="soft">Отмена</button><button id="itemSubmit" class="primary">Сохранить</button></div></form></dialog>
  <dialog id="shareDialog"><div class="share-dialog"><button id="closeShare" class="share-close">×</button><h2>Поделиться TyuProduct</h2><p>Отсканируйте QR-код или отправьте ссылку</p><div id="qrLarge" class="qr-large"></div><input id="shareUrl" readonly><button id="nativeShare" class="primary">Поделиться ссылкой</button></div></dialog>
  <script type="module" src="./app.js?v=5"></script>
</body>
</html>
