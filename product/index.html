<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>TyuProduct — склад кухни</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css?v=1">
</head>
<body>
  <div id="auth" class="auth"><div class="auth-card"><div class="logo">TP</div><h1>TyuProduct</h1><p>Учёт продуктов и упаковки на кухне</p><div id="authError" class="error"></div><button id="googleLogin" class="primary">G&nbsp;&nbsp;Войти через Google</button></div></div>
  <main id="app" class="hidden">
    <header class="top"><div><small>СКЛАД КУХНИ</small><h1>TyuProduct</h1></div><button id="logout" class="icon-btn" title="Выйти">↪</button></header>
    <section class="hero">
      <div><span>Текущая смена</span><input id="shiftName" aria-label="Название смены"></div>
      <button id="newShift" class="soft">Новая смена</button>
    </section>
    <section class="summary">
      <article><span>Позиций</span><strong id="allCount">0</strong></article>
      <article class="danger-card"><span>Нужно купить</span><strong id="missingCount">0</strong></article>
      <article class="ok-card"><span>В достатке</span><strong id="okCount">0</strong></article>
    </section>
    <section class="tools">
      <input id="search" type="search" placeholder="Поиск продукта или упаковки">
      <button id="addItem" class="icon-btn plus" title="Добавить">＋</button>
    </section>
    <nav id="categories" class="chips"></nav>
    <label class="only-missing"><input id="onlyMissing" type="checkbox"> Показать только то, что нужно купить</label>
    <section id="list" class="inventory"></section>
    <section id="result" class="result">
      <div class="result-head"><div><small>РЕЗУЛЬТАТ СМЕНЫ</small><h2>Что нужно получить</h2></div><button id="copyResult" class="soft">Копировать</button></div>
      <div id="needList" class="need-list"></div>
      <button id="saveShift" class="primary save">Сохранить смену</button>
      <div id="saveStatus" class="status"></div>
    </section>
  </main>
  <dialog id="itemDialog"><form id="itemForm" method="dialog"><h2>Новая позиция</h2><label>Название<input id="itemName" required placeholder="Например: палочки для суши"></label><label>Категория<select id="itemCategory"><option>Продукты</option><option>Соусы и специи</option><option>Упаковка</option><option>Расходники</option></select></label><div class="two"><label>Единица<select id="itemUnit"><option>кг</option><option>л</option><option>шт</option><option>рул</option><option>уп</option></select></label><label>Должно быть<input id="itemTarget" type="number" min="0" step="0.001" value="0"></label></div><div class="dialog-actions"><button type="button" id="cancelItem" class="soft">Отмена</button><button class="primary">Добавить</button></div></form></dialog>
  <script type="module" src="./app.js?v=1"></script>
</body>
</html>
